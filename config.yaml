# ============================================================
# Radar de Editais — configuração
# Edite à vontade: o radar lê este arquivo a cada execução.
# ============================================================

# Estados monitorados pelo radar (siglas). Vazio ([]) = Brasil inteiro.
# A aba Pesquisar do dashboard sempre busca no Brasil inteiro, independente disto.
ufs: [PI, MA, CE, BA]

# Cidades de interesse (vazio = todas as cidades dos estados acima).
# Comparação ignora acentos/maiúsculas. Ex.: [Teresina, Parnaíba]
municipios: []

# Modalidades PNCP a monitorar:
#   4 Concorrência Eletrônica | 5 Concorrência Presencial
#   6 Pregão Eletrônico       | 7 Pregão Presencial
#   8 Dispensa                | 9 Inexigibilidade | 12 Credenciamento
modalidades: [4, 5, 6, 7, 8]

# Até quantos dias no futuro considerar encerramento de propostas
dias_horizonte: 90

# Só registrar licitações com valor estimado >= (0 = sem piso).
# Valor sigiloso/não informado passa sempre.
valor_minimo: 0

# Grupos de interesse: a licitação entra no radar se o objeto
# contiver qualquer termo (comparação sem acentos/maiúsculas;
# termo curto tipo "asfalt" casa "asfaltamento", "asfáltica"...)
categorias:
  climatizacao:
    termos:
      - ar condicionado
      - ar-condicionado
      - climatiza
      - refrigera
      - split
      - vrf
      - chiller
      - camara fria
      - camara frigorifica
      - ventilacao mecanica
      - exaustao
  obras:
    termos:
      - pavimenta
      - recapeamento
      - asfalt
      - obra de engenharia
      - obras de engenharia
      - obras civis
      - construcao civil
      - reforma predial
      - reforma e ampliacao
      - drenagem
      - calcamento
      - paralelepipedo
      - bloquete
      - terraplanagem
      - terraplenagem
      - esgotamento sanitario
      - saneamento basico
      - ponte
      - quadra poliesportiva
      - edificacao
      - unidade escolar
      - unidade basica de saude

# Termos que descartam a licitação mesmo se casar acima
excluir_termos: []
# exemplo: [locacao de veiculos, merenda escolar]

# Digest por e-mail (Gmail: crie uma "senha de app" em
# https://myaccount.google.com/apppasswords e cole abaixo)
email:
  habilitado: false
  smtp_host: smtp.gmail.com
  smtp_porta: 587
  usuario: pecfurtado@gmail.com
  senha_app: ""
  destinatarios: [pecfurtado@gmail.com]

# Coletor do Mural de Licitações do TCE-PI (melhor esforço)
tcepi:
  habilitado: true
  dias_retroativos: 7   # busca aberturas dos últimos N dias

dashboard:
  porta: 8765
