name: Radar diário

on:
  schedule:
    - cron: "0 9 * * *"    # 06:00 em America/Fortaleza
  workflow_dispatch: {}     # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Fortaleza
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coleta + alerta diário (Telegram e e-mail)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ATIVO: ${{ secrets.SMTP_PASSWORD != '' && 'true' || 'false' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python -m app.rotina

      - name: Atualizar site do celular
        run: python gerar_site.py

      - name: Publicar banco e site
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@github.com"
          git add data/radar.db docs/dados.json
          git diff --cached --quiet || git commit -m "Radar $(date +'%d/%m/%Y %H:%M')"
          git push
