name: Radar diário

on:
  schedule:
    - cron: "0 9 * * *"    # 06:00 em America/Fortaleza
  workflow_dispatch: {}     # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Fortaleza
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Os ALERTAS diários saem do app no Railway (que roda 24h).
      # Aqui só coletamos para manter o site do celular (GitHub Pages) em dia,
      # por isso nenhum secret de Telegram/e-mail é passado.
      - name: Coleta para o site do celular
        run: python -m app.rotina

      - name: Atualizar site do celular
        run: python gerar_site.py

      - name: Publicar banco e site
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@github.com"
          git add data/radar.db docs/dados.json
          git diff --cached --quiet || git commit -m "Radar $(date +'%d/%m/%Y %H:%M')"
          git push
