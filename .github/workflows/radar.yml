name: Radar diário

on:
  schedule:
    - cron: "0 11 * * *"   # 08:00 no horário de Brasília
  workflow_dispatch: {}     # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o radar (coleta + digest)
        env:
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_SENHA_APP: ${{ secrets.GMAIL_SENHA_APP }}
          EMAIL_DESTINATARIOS: ${{ secrets.EMAIL_DESTINATARIOS }}
        run: python radar.py

      - name: Gerar site
        run: python gerar_site.py

      - name: Publicar banco e site atualizados
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@github.com"
          git add editais.db docs/dados.json
          git diff --cached --quiet || git commit -m "Radar $(date +'%d/%m/%Y %H:%M')"
          git push
