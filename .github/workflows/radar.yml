name: Radar diário

on:
  schedule:
    - cron: "0 9 * * *"    # 06:00 em America/Fortaleza
  workflow_dispatch: {}     # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Fortaleza
      # Endereço DESTA instalação (o link "Ver todas" dos alertas e a
      # sincronização de perfis apontam para cá). Configuração de deploy,
      # não código: cada empresa põe o seu.
      APP_URL: https://radar-editais-production-67c1.up.railway.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Divisão de canais: o TELEGRAM diário sai do app no Railway (24h);
      # o E-MAIL sai daqui (o Railway bloqueia SMTP na plataforma inteira).
      # Por isso este job recebe só os secrets de SMTP — nada de Telegram.
      - name: Coleta + alerta por e-mail + site do celular
        env:
          EMAIL_ATIVO: "true"
          # Com este secret, o robô puxa os perfis do site antes de coletar
          # (o site é onde o Paulo edita). Sem ele, usa os do repositório.
          APP_SENHA: ${{ secrets.APP_SENHA }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python -m app.rotina

      - name: Publicar banco (estado dos alertas)
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@github.com"
          # Se o PC do Paulo empurrou durante a rodada, um push direto falha e
          # o estado dos alertas desta rodada se perde em silêncio (workflow
          # vermelho que ninguém vê). Rebaixa o HEAD para o remoto mantendo o
          # banco recém-gravado e tenta de novo — banco é binário, não há
          # merge possível, e o combinado é que a última escrita vence.
          for tentativa in 1 2 3; do
            git fetch origin main
            git reset --soft origin/main
            git add data/radar.db
            if git diff --cached --quiet; then
              echo "Banco sem mudanças; nada a publicar."
              exit 0
            fi
            git commit -m "Radar $(date +'%d/%m/%Y %H:%M')"
            if git push; then
              echo "Banco publicado na tentativa $tentativa."
              exit 0
            fi
            echo "Push recusado (alguém empurrou antes); tentando de novo..."
            sleep 5
          done
          echo "::error::Não consegui publicar o banco após 3 tentativas."
          exit 1
