name: Radar diário

on:
  schedule:
    - cron: "0 9 * * *"    # 06:00 em America/Fortaleza
  workflow_dispatch: {}     # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Fortaleza
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Divisão de canais: o TELEGRAM diário sai do app no Railway (24h);
      # o E-MAIL sai daqui (o Railway bloqueia SMTP na plataforma inteira).
      # Por isso este job recebe só os secrets de SMTP — nada de Telegram.
      - name: Coleta + alerta por e-mail + site do celular
        env:
          EMAIL_ATIVO: "true"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python -m app.rotina

      - name: Publicar banco (estado dos alertas)
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@github.com"
          git add data/radar.db
          git diff --cached --quiet || git commit -m "Radar $(date +'%d/%m/%Y %H:%M')"
          git push
