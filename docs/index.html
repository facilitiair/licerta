<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a5fb4">
<title>Radar de Editais</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg">
<link rel="apple-touch-icon" href="icone.svg">
<style>
  :root{--azul:#1a5fb4;--fundo:#f4f6f9;--card:#fff;--borda:#dde3ec;--texto:#2b3442;--sutil:#6b7686;
        --verde:#1a7f37;--laranja:#b35c00;--vermelho:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--fundo);color:var(--texto)}
  header{background:var(--azul);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:5}
  header .topo{display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:17px;margin:0}
  #atualizado{font-size:11px;opacity:.8}
  nav{display:flex;gap:6px;margin-top:8px}
  nav button{flex:1;background:rgba(255,255,255,.12);border:none;color:#dce8f7;font-size:14px;
             padding:8px;cursor:pointer;border-radius:8px}
  nav button.ativo{background:#fff;color:var(--azul);font-weight:700}
  main{max-width:760px;margin:0 auto;padding:12px}
  .filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .filtros select,.filtros input,.filtros button{padding:9px 10px;border:1px solid var(--borda);
      border-radius:8px;font-size:14px;background:#fff}
  .filtros input[type=search]{flex:1 1 100%;min-width:0}
  .filtros select{flex:1}
  .filtros .btn{background:var(--azul);color:#fff;border:none;font-weight:600;cursor:pointer}
  .card{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .meta{font-size:11.5px;color:var(--sutil);line-height:1.6}
  .badge{padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:700;margin-right:4px}
  .b-climatizacao{background:#e0f0ff;color:var(--azul)} .b-obras{background:#e6f4e6;color:var(--verde)}
  .b-geral,.b-manual{background:#efe9fb;color:#5b3fa8}
  .b-novo{background:#fff3cd;color:var(--laranja)} .b-interesse{background:#d4edda;color:var(--verde)}
  .b-visto{background:#e9ecef;color:var(--sutil)} .b-descartado{background:#f8d7da;color:var(--vermelho)}
  .objeto{margin:7px 0 5px;font-size:14px;line-height:1.45}
  .info{font-size:12.5px;display:flex;gap:12px;flex-wrap:wrap}
  .prazo-apertado{color:var(--vermelho);font-weight:700}
  .acoes{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .acoes button,.acoes a{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--borda);
        background:#fff;cursor:pointer;text-decoration:none;color:var(--texto)}
  .acoes .interesse{border-color:var(--verde);color:var(--verde)}
  .acoes .descartar{border-color:var(--vermelho);color:var(--vermelho)}
  #resumo,#bResumo{font-size:12.5px;color:var(--sutil);margin:6px 2px 10px}
  #paginacao{display:flex;gap:8px;justify-content:center;margin:14px 0}
  #paginacao button{padding:8px 16px;border-radius:8px;border:1px solid var(--borda);background:#fff;cursor:pointer}
  .aviso{background:#fff8e1;border:1px solid #f0d47a;border-radius:10px;padding:10px 12px;
         font-size:12.5px;margin-bottom:10px;color:#6b5300}
  .oculto{display:none}
  footer{text-align:center;font-size:11.5px;color:var(--sutil);padding:16px}
  footer a{color:var(--azul)}
</style>
</head>
<body>
<header>
  <div class="topo">
    <h1>📡 Radar de Editais</h1>
    <span id="atualizado"></span>
  </div>
  <nav>
    <button id="tabRadar" class="ativo" onclick="aba('radar')">Meu radar</button>
    <button id="tabBusca" onclick="aba('busca')">Pesquisar</button>
  </nav>
</header>

<main>
<section id="secRadar">
  <div class="filtros">
    <input type="search" id="fQ" placeholder="Filtrar por objeto, órgão ou cidade..." oninput="render()">
    <select id="fStatus" onchange="render()">
      <option value="ativas">Ativas</option>
      <option value="novo">Novas</option>
      <option value="interesse">De interesse</option>
      <option value="visto">Vistas</option>
      <option value="descartado">Descartadas</option>
      <option value="">Todas</option>
    </select>
    <select id="fCat" onchange="render()"><option value="">Categorias</option></select>
    <select id="fUf" onchange="render()"><option value="">Estados</option></select>
  </div>
  <div id="resumo"></div>
  <div id="lista"></div>
</section>

<section id="secBusca" class="oculto">
  <div class="filtros">
    <input type="search" id="bQ" placeholder="Qualquer objeto: merenda, software, ambulância..."
           onkeydown="if(event.key==='Enter')pesquisar(1)">
    <select id="bUf"><option value="">Brasil</option></select>
    <select id="bStatus">
      <option value="recebendo_proposta">Abertas</option>
      <option value="">Todas</option>
      <option value="encerradas">Encerradas</option>
    </select>
    <button class="btn" onclick="pesquisar(1)">🔍 Pesquisar</button>
  </div>
  <div id="bResumo"></div>
  <div id="bLista"></div>
  <div id="paginacao"></div>
</section>
</main>

<footer>
  Dados: <a href="https://pncp.gov.br" target="_blank">PNCP</a> e Mural TCE-PI ·
  <a id="linkConfig" href="#" target="_blank">editar configuração do radar</a>
</footer>

<script>
const UFS=["AC","AL","AM","AP","BA","CE","DF","ES","GO","MA","MG","MS","MT","PA","PB","PE","PI",
           "PR","RJ","RN","RO","RR","RS","SC","SE","SP","TO"];
let DADOS={itens:[],gerado_em:null,repo:""};
const chave=it=>it.fonte+'|'+it.id_fonte;
const marcas=JSON.parse(localStorage.getItem('marcas')||'{}');

function salvarMarca(k,status){
  if(status==='novo') delete marcas[k]; else marcas[k]=status;
  localStorage.setItem('marcas',JSON.stringify(marcas));
  render();
}
function statusDe(it){ return marcas[chave(it)]||'novo'; }

function aba(a){
  document.getElementById('secRadar').classList.toggle('oculto',a!=='radar');
  document.getElementById('secBusca').classList.toggle('oculto',a!=='busca');
  document.getElementById('tabRadar').classList.toggle('ativo',a==='radar');
  document.getElementById('tabBusca').classList.toggle('ativo',a==='busca');
}
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function fmtValor(v){return v==null?'valor não informado':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function fmtData(d){if(!d)return'ver edital';const[x,h]=d.split('T');const[a,m,dia]=x.split('-');
  return `${dia}/${m}/${a}`+(h?` ${h}`:'')}
function diasAte(d){return d?Math.ceil((new Date(d)-new Date())/864e5):null}

function cartao(it,acoesHtml){
  const dias=diasAte(it.data_encerramento);
  const st=statusDe(it);
  return `<div class="card">
    <div class="meta">
      <span class="badge b-${st}">${st.toUpperCase()}</span>
      ${(it.categoria||'').split(',').filter(Boolean).map(c=>`<span class="badge b-${c}">${c}</span>`).join('')}
      ${it.modalidade||''} · ${it.municipio?it.municipio+'/':''}${it.uf||''} · ${it.orgao||''}
    </div>
    <div class="objeto">${it.objeto||''}</div>
    <div class="info">
      <span>💰 ${fmtValor(it.valor_estimado)}</span>
      <span class="${dias!=null&&dias<=5?'prazo-apertado':''}">⏱️ até ${fmtData(it.data_encerramento)}
        ${dias!=null?`(${dias<0?'encerrado':dias+' d'})`:''}</span>
    </div>
    <div class="acoes">${it.link?`<a href="${it.link}" target="_blank">🔗 Edital</a>`:''}${acoesHtml}</div>
  </div>`;
}

function render(){
  const q=norm(document.getElementById('fQ').value);
  const fs=document.getElementById('fStatus').value;
  const fc=document.getElementById('fCat').value;
  const fu=document.getElementById('fUf').value;
  const agora=new Date();
  let itens=DADOS.itens.filter(it=>{
    const st=statusDe(it);
    if(fs==='ativas'){ if(st==='descartado')return false; }
    else if(fs && st!==fs) return false;
    if(fc && !(it.categoria||'').includes(fc)) return false;
    if(fu && it.uf!==fu) return false;
    if(q && !norm(it.objeto+' '+it.orgao+' '+(it.municipio||'')).includes(q)) return false;
    return true;
  });
  itens.sort((a,b)=>{
    const pa=a.data_encerramento?new Date(a.data_encerramento):null;
    const pb=b.data_encerramento?new Date(b.data_encerramento):null;
    const ga=pa?(pa<agora?2:0):1, gb=pb?(pb<agora?2:0):1;
    return ga-gb || (pa&&pb?pa-pb:0);
  });
  document.getElementById('resumo').textContent=`${itens.length} licitação(ões)`;
  document.getElementById('lista').innerHTML=itens.slice(0,300).map(it=>{
    const k=chave(it), st=statusDe(it);
    return cartao(it,`
      <button class="interesse" onclick="salvarMarca('${k}','interesse')">⭐ Interesse</button>
      <button onclick="salvarMarca('${k}','visto')">👁 Visto</button>
      <button class="descartar" onclick="salvarMarca('${k}','descartado')">✖</button>
      ${st!=='novo'?`<button onclick="salvarMarca('${k}','novo')">↩</button>`:''}`);
  }).join('');
}

/* Busca ao vivo no PNCP (a API libera CORS) */
let bItens=[];
async function pesquisar(pagina){
  const p=new URLSearchParams({tipos_documento:'edital',ordenacao:'-data',pagina,tam_pagina:20});
  const q=document.getElementById('bQ').value.trim(); if(q)p.set('q',q);
  const uf=document.getElementById('bUf').value; if(uf)p.set('ufs',uf);
  const st=document.getElementById('bStatus').value; if(st)p.set('status',st);
  document.getElementById('bResumo').textContent='Buscando...';
  try{
    const r=await fetch('https://pncp.gov.br/api/search/?'+p);
    const d=await r.json();
    bItens=(d.items||[]).map(i=>({
      fonte:'pncp', id_fonte:i.numero_controle_pncp, orgao:i.orgao_nome,
      municipio:i.municipio_nome, uf:i.uf, modalidade:i.modalidade_licitacao_nome,
      objeto:(i.description||'').trim(), valor_estimado:i.valor_global,
      data_encerramento:(i.data_fim_vigencia||'').slice(0,16), categoria:'',
      link:i.orgao_cnpj?`https://pncp.gov.br/app/editais/${i.orgao_cnpj}/${i.ano}/${parseInt(i.numero_sequencial)}`:null
    }));
    document.getElementById('bResumo').textContent=
      `${(d.total||0).toLocaleString('pt-BR')} edital(is) — página ${pagina} de ${Math.max(1,Math.ceil((d.total||0)/20))}`;
    document.getElementById('bLista').innerHTML=bItens.map((it,i)=>
      cartao(it,`<button class="interesse" onclick="salvarMarca('${chave(it)}','interesse')">⭐ Marcar interesse</button>`)
    ).join('');
    const ult=Math.ceil((d.total||0)/20);
    document.getElementById('paginacao').innerHTML=`
      <button ${pagina<=1?'disabled':''} onclick="pesquisar(${pagina-1})">← Anterior</button>
      <button ${pagina>=ult?'disabled':''} onclick="pesquisar(${pagina+1})">Próxima →</button>`;
  }catch(e){
    document.getElementById('bResumo').textContent='PNCP indisponível no momento: '+e.message;
  }
}

async function iniciar(){
  document.getElementById('bUf').innerHTML='<option value="">Brasil</option>'+
    UFS.map(u=>`<option>${u}</option>`).join('');
  try{
    const r=await fetch('dados.json?v='+Date.now());
    DADOS=await r.json();
    document.getElementById('atualizado').textContent='atual.: '+(DADOS.gerado_em||'');
    if(DADOS.repo) document.getElementById('linkConfig').href=
      `https://github.com/${DADOS.repo}/edit/main/config.yaml`;
    const cats=[...new Set(DADOS.itens.flatMap(i=>(i.categoria||'').split(',')).filter(Boolean))];
    document.getElementById('fCat').innerHTML='<option value="">Categorias</option>'+
      cats.map(c=>`<option>${c}</option>`).join('');
    const ufs=[...new Set(DADOS.itens.map(i=>i.uf).filter(Boolean))].sort();
    document.getElementById('fUf').innerHTML='<option value="">Estados</option>'+
      ufs.map(u=>`<option>${u}</option>`).join('');
  }catch(e){
    document.getElementById('resumo').textContent='Sem dados do radar ainda — use a aba Pesquisar.';
  }
  render();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
}
iniciar();
</script>
</body>
</html>
