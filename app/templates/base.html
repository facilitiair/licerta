<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Radar de Licitações{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <header class="bg-blue-800 text-white sticky top-0 z-10 shadow">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-4 flex-wrap">
      <a href="/" class="font-bold text-lg">📡 Radar de Licitações</a>
      <nav class="flex gap-1 text-sm">
        <a href="/" class="px-3 py-1.5 rounded-lg hover:bg-blue-700">Painel</a>
        <a href="/perfis" class="px-3 py-1.5 rounded-lg hover:bg-blue-700">Perfis</a>
      </nav>
      <a href="/logout" class="ml-auto text-blue-200 text-sm hover:text-white">Sair</a>
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-4 py-5">
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
