{% if coletando %}
  <span class="inline-flex items-center gap-2 text-amber-700 text-sm"
        hx-get="/coleta/status" hx-trigger="every 5s" hx-swap="outerHTML">
    <i data-lucide="loader-circle" class="lucide animate-spin"></i>
    Buscando novidades... (a página atualiza sozinha)
  </span>
{% else %}
  <span class="inline-flex items-center gap-2 text-sm text-green-700"
        hx-get="/" hx-trigger="load" hx-target="body" hx-swap="innerHTML">
    <i data-lucide="check" class="lucide"></i> Tudo atualizado — recarregando...
  </span>
{% endif %}
